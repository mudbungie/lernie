[package]
name = "lernie-eval-agent"
version = "0.1.0"
edition = "2024"
description = "Harness driver for the lernie evaluation runner: the far side of the ARCH §9.3 agent seam"
license = "MIT"
# Workspace-internal, like `agent-eval` (ARCH §9.3): the driver is
# evaluation tooling for this repo's suite, not part of the published
# lernie crate.
publish = false

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lernie-eval-agent"
path = "src/main.rs"
