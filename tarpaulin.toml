# Repo-wide tarpaulin defaults: applied by every `cargo tarpaulin` run,
# including the pre-commit hook.
#
# Pinned tarpaulin version: 0.35.2 (also pinned in .github/workflows/ci.yml).
# 0.35.3 was yanked, and 0.35.4+ silently excludes inline `#[cfg(test)] mod
# tests;` files from the coverable denominator. The 100% floor only means
# the same thing on every machine if everyone is on the same tarpaulin —
# upgrade in lockstep (workflow + this file + Makefile preflight) or the
# floor gets quietly weaker on whichever side moves first.
#
# - Schema generation (`config::schemas`) is unit-tested directly and
#   pinned by the `schemas_golden` in-crate golden test (which replaced
#   the former `gen-schemas` binary, ARCH §3.4): `write_to` runs on every
#   test pass (into a throwaway dir), so no generation mechanism sits
#   outside the coverage floor.
# - `ignore-panics` excludes branches that only fire on programmer-error
#   panics (e.g. `.expect(...)` on infallible operations).
# - `src/e2e/*` is the end-to-end subprocess-test boundary, the coverage
#   analogue of the `src/bin/*` exec-binding boundary above. These modules
#   drive the real `lernie` binary as a subprocess and carry failure-only
#   scaffolding (timeout kills, stderr drains, early-exit diagnostics) that
#   a passing run never executes. They were migrated in from `tests/`
#   (which tarpaulin never counts in the denominator) only because the
#   §3.4 narrowing made their private fixtures unreachable from an external
#   test crate — so excluding them keeps the exact denominator they had as
#   `tests/`. The production code they exercise stays fully counted.
# - `timeout` is bumped above tarpaulin's 60s default because the
#   `src/e2e/prompt_end_to_end.rs` test chains two subprocess binaries
#   (`lernie new` + `lernie prompt`) under instrumentation, which inflates
#   wall-clock time well past the per-test default.
# - `args = ["--test-threads=1"]` pins serial test execution: the
#   bash-tool cascade tests deliver SIGTERM/SIGKILL to spawned shell
#   process groups, and tarpaulin's ptrace state machine races
#   against parallel teardown of those groups (`Failed to find
#   process for pid: …` → segfault). Serial execution sidesteps the
#   race; the 100% workspace coverage floor stays the same.
[default]
exclude-files = ["src/bin/*", "src/bin/lernie/*", "src/e2e/*", "crates/*/src/main.rs"]
ignore-panics = true
timeout = "300s"
args = ["--test-threads=1"]
