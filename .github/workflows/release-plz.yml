name: Release-plz

# **The release path, armed** (bl-459d). Build-gated and hands-off: a push to
# `main` runs the gate, keeps the release PR fresh, and releases any version in
# the manifest the registry does not already serve.
#
# THE FILENAME IS NOT A PREFERENCE. crates.io holds a TRUSTED PUBLISHER for the
# `lernie` crate — the model that replaces a stored registry token. Instead of
# keeping a long-lived secret in this repository, the registry records that ONE
# named workflow file in ONE named GitHub repository may publish ONE named
# crate; at run time GitHub mints a short-lived signed OIDC token asserting
# exactly that identity, and release-plz trades it for a ~30-minute registry
# token scoped to this crate. The workflow FILENAME is matched literally against
# that claim, so RENAMING THIS FILE BREAKS PUBLISHING until the registry entry
# is updated to match. `id-token: write` on the release job is the whole grant
# and it exists on that job alone. No `CARGO_REGISTRY_TOKEN` is set here and
# none should be; release-plz performs the exchange itself, so
# `rust-lang/crates-io-auth-action` must NOT also be added.
#
# The publisher was already registered, from the engine era, naming this
# repository and this filename (bl-f468) — the engine's repository was renamed
# and this one took the name, so the repository half still matches. That is why
# there is no registration step below and why this file arrived where it did:
# the crate is set to accept trusted publishing ONLY, so a token `cargo publish`
# is answered `403 Forbidden` however the manifest is written, and this workflow
# is not a convenience over the hand-run act — it is the only route the registry
# leaves open.
#
# THE JOBS, and what each is for.
#
#   * ci — the whole CI workflow, executed HERE via
#     `uses: ./.github/workflows/ci.yml` (a `workflow_call`), never observed
#     from a distance. That placement is the one detail most likely to be
#     "simplified" into a bug: crates.io REFUSES an OIDC token minted under a
#     `workflow_run` trigger, so gating the release on an observed CI run
#     publishes nothing, quietly, forever. A called workflow runs inside THIS
#     run, which keeps the claim at trigger=push / workflow `release-plz.yml`
#     while the release job still hard-gates on it through `needs:`. `ci.yml`
#     has no push arm of its own, so a push to `main` runs the gate exactly once
#     — here.
#   * release-plz PR (push to `main` only) — opens or refreshes ONE "release PR"
#     that bumps the version in `Cargo.toml`/`Cargo.lock` and nothing else
#     (`changelog_update = false` in `release-plz.toml`, with the reason). It
#     never publishes; merging it is the human control point. It does not wait
#     on `ci` — it touches nothing the gate protects.
#   * release (`needs: ci`) — releases any manifest version the registry does
#     not serve: tags it `v<version>` (`release-plz.toml`'s `git_tag_name`, and
#     the reason the tag is bare there), cuts a GitHub Release, and publishes to
#     crates.io. Behind the gate, so a release only ever ships a GREEN tree.
#   * macos — the PROOF of the seat's darwin artifact, not the artifact
#     (bl-9380): the crate is the artifact on every platform, and this job
#     builds the released tag NATIVELY on an Apple runner — what an operator's
#     `cargo install lernie --locked` builds on a mac — and then READS the
#     result rather than trusting it. It hangs off the release job, so it runs
#     once per published version, and NOTHING needs it: a mac leg reports, it
#     does not hold the release gate. Its own header below says why.
#   * prune-release-branches (right after the PR job) — deletes every
#     `release-plz-*` branch with no open PR. release-plz pushes a NEW
#     timestamped branch each time it refreshes the release PR, and pushes it
#     BEFORE opening the PR, so superseded and orphaned branches pile up one per
#     push to `main`; the repository's "automatically delete head branches"
#     setting only fires on MERGE and never sees them.
#   * merge-release-pr (last, after the pruner) — merges the release PR the PR
#     job just opened, under two conjunctive guards, and then DISPATCHES this
#     workflow, because a merge performed with `GITHUB_TOKEN` triggers no run at
#     all. Merging is not the release gate — `release` above is, post-merge — so
#     a human holding this PR only delays a decision the gate makes anyway. Its
#     own header says why native auto-merge cannot stand in for it.
#
# ONE-TIME REPOSITORY SETUP, both done:
#   * Settings → Actions → General → "Allow GitHub Actions to create and approve
#     pull requests" — without it the release-PR job 403s.
#   * The crates.io trusted publisher above (owner `mudbungie`, repository
#     `lernie`, workflow filename `release-plz.yml`, environment empty).
#   * RELEASE_PLZ_TOKEN is OPTIONAL — a fine-grained PAT (contents +
#     pull-requests write) so the release PR's own commits re-trigger CI, which
#     the default token cannot do for its own pushes. The PR job falls back to
#     `GITHUB_TOKEN` when it is unset.
#
# NOT HERE, deliberately. No upload job for any binary, on any platform — a
# RULING, not a deferral (bl-9380, DESIGN §6.3): the seat's unit of install is
# the published crate, compiled on the box that has the display, and a release
# asset would be a second home for the same artifact and a worse one on a mac,
# where a downloaded binary is refused until somebody clears its quarantine
# attribute. Signing and notarization are not a build-line act: replacing the
# linker's ad-hoc signature with a real one needs a credential this repository
# may not hold, and `cargo install` needs none — a binary compiled on the box
# carries no quarantine attribute at all. No container image either, and that
# is the same ruling read from the other side (bl-18c7, DESIGN §6.4): an image
# is the unit of install for a box that takes images, and a seat's box is a
# desktop that already has every layer such an image could carry.

# No `workflow_run` arm anywhere — see the `ci` job. The gate is `needs: ci`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read by default; each job that writes says so and says why. Job-level
# `permissions` REPLACE this block rather than adding to it.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Owner guard: never runs in a fork. Safe against fork-PR abuse because
    # neither trigger is reachable from a fork — a fork PR fires `pull_request`,
    # which is not requested here, and never a push to this `main` or a dispatch
    # on it, both of which need write access upstream.
    if: github.repository_owner == 'mudbungie'
    # Job-level permissions on a `uses:` job set the ceiling for every job in
    # the called workflow. CI reads the tree and writes nothing back.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Only a direct push maintains the release PR. A dispatch is for releasing.
    if: github.repository_owner == 'mudbungie' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    # Never two release-PR updates at once — they would race on the branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release-plz reads the whole history to decide the next version.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # The SHA pin erases the ref name this action reads the toolchain
          # from, so name it; rust-toolchain.toml still pins the build version.
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # No registry credential here: this job only opens the PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # THE BUILD GATE, and the whole of it. A failed or skipped `ci` skips this
    # job — the implicit success() in `if` sees to that.
    needs: ci
    if: github.repository_owner == 'mudbungie'
    permissions:
      # To push the `v<version>` tag and cut the GitHub Release.
      contents: write
      # The trusted-publishing grant: it lets this job ask GitHub for the signed
      # OIDC token release-plz trades for a short-lived registry token. Scoped
      # to this one job — no other job here can ask, and none needs to.
      id-token: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    # Tell the macOS job whether a release happened and WHICH tag it cut. The
    # tag is handed off as DATA: this job releases the branch tip as of ITS
    # start, which is not necessarily the run's `github.sha`, and a `git
    # describe` in another job asks a checkout what it happens to see (the
    # sibling server repo shipped the previous version that way once).
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The BRANCH, not the run's pinned sha: release-plz resolves the
          # current branch through `@{upstream}`, which fails on a detached
          # HEAD. `ref_name` is `main` for both triggers.
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - name: Run release-plz
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          # Publishing is authenticated by the OIDC grant above, not by a stored
          # registry secret. This token is for the tag and the GitHub Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the released tag
        # `releases` is the action's own JSON record of what it just released,
        # e.g. [{"package_name":"lernie","prs":[],"tag":"v0.1.26","version":"0.1.26"}].
        # One crate releases here, so `.[0].tag` is it. Read via env, so the
        # JSON never reaches the shell as code.
        id: released
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          printf 'tag=%s\n' "$(jq -r '.[0].tag' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS artifact (aarch64-apple-darwin)
    # THE PROOF OF THE ARTIFACT, NOT THE ARTIFACT (bl-9380, DESIGN §6.3). The
    # seat ships no mac binary. Its unit of install is the crate — `cargo
    # install lernie --locked` on the mac, the same act the Linux seat box's
    # reconciler performs hourly (README, "Continuous deployment for a seat
    # box") — so what this job builds is what that act builds: the released
    # tree, natively, with the SDK the box already has. Then it READS the
    # result rather than trusting it. A binary attached to the release would
    # be a second home for the same artifact and a worse one: the linker's
    # signature is ad-hoc, a downloaded copy is refused until someone on the
    # mac clears its quarantine attribute, and notarization is a credentialled
    # act needing a secret this repository may not hold. A binary compiled on
    # the box carries no quarantine attribute and simply runs.
    #
    # ONCE PER PUBLISHED VERSION, ON THE TAG. It hangs off the release job's
    # `releases_created` and checks out the `v<version>` tag that job cut, so
    # its verdict names a version an operator can install. It used to `needs:
    # ci` and run on every push and every dispatch — twice per landing, once on
    # a tree nobody would ever install (the pre-bump tip) and once on
    # `github.sha`, which is not necessarily the tree release-plz released.
    # Nothing `needs:` THIS job, in both directions deliberately: a broken mac
    # build must be visible (so no `continue-on-error`) — it reddens the run
    # that published the version it broke, and the remedy is the next version,
    # exactly as for a bad crate — and it must never stand between a green
    # tree and the registry (so no `needs: macos` on the release job). The
    # owner guard and the CI gate arrive through `needs:` — a skipped release
    # job skips this one.
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    # THE ONLY LAWFUL DARWIN ROUTE FOR THIS CRATE, and the reason it is a job
    # rather than a toolchain. The seat's window links Apple frameworks —
    # OpenGL, AppKit, CoreGraphics, Foundation, CoreFoundation,
    # ApplicationServices, CoreVideo, Carbon, plus `-lobjc`. Every crate in the
    # graph cross-COMPILES for `aarch64-apple-darwin` under the pinned
    # toolchain; the LINK is what fails, because the frameworks live only in
    # Apple's SDK and the SDK agreement refuses both hosting it (§2.7) and
    # running any part of it on non-Apple hardware (§2.5). The operator ruled
    # that a GitHub Actions macOS runner IS Apple-branded hardware in the
    # licence's sense, so the remedy is to build where the SDK already is.
    # NOTHING IN THIS REPOSITORY EVER ACQUIRES, VENDORS OR PATHS TO AN SDK, and
    # nothing cross-compiles darwin from Linux — a Linux toolchain that
    # succeeded would be one that had acquired the SDK.
    #
    # `macos-14` is the pinned Apple-silicon image, so the native target IS
    # `aarch64-apple-darwin` and no cross flag is needed.
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The TAG the release job cut, as its output — the released tree and
          # no other. Never `github.sha` (main's tip when the run was
          # triggered) and never `git describe` (whatever this checkout can
          # see): the release job's header says which tree it releases.
          ref: refs/tags/${{ needs.release-plz-release.outputs.tag }}
          persist-credentials: false
      # The tag and the manifest are two independent statements of one fact,
      # and this job proves a version only when they agree. That turns "proved
      # the wrong tree, silently" into "said no". The `sed` range restricts to
      # `[package]`, so a dependency's `version =` cannot be read as the
      # crate's.
      - name: The tag and the manifest must agree
        env:
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          set -euo pipefail
          manifest="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml |
                      sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1)"
          if [ "$TAG" != "v$manifest" ]; then
            echo "tag $TAG does not name the checked-out crate version $manifest — refusing to build" >&2
            exit 1
          fi
          echo "proving $TAG (Cargo.toml says $manifest)"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # THE NEGATIVE DIRECTION FIRST. A reader that has stopped reading passes
      # everything forever, so it is fed five fabricated malformed inputs it
      # must refuse BEFORE it is shown the real artifact. Same two-direction
      # discipline as `make leak-scan` and `make rules-audit`.
      - name: Verify the verifier
        run: scripts/mac-verify.sh --self-test
      - name: Build
        run: cargo build --release --locked
      # "The build succeeded" is not enough: a linker that produced the wrong
      # architecture, a graph that acquired a dependency on a dylib no stock mac
      # carries, or a binary macOS would refuse to start all look identical to a
      # green build. Every one of those is readable out of the file itself.
      - name: Read what was produced
        run: scripts/mac-verify.sh target/release/lernie

  prune-release-branches:
    name: prune superseded release branches
    # `needs` with no `if`: only after the release-PR job actually ran and
    # succeeded, so pruning only ever follows a PR refresh. On a dispatch that
    # job is skipped and so is this one.
    needs: release-plz-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Because this job runs immediately after the PR job, the branch backing the
    # CURRENT release PR is already open — which makes "has no open PR" an exact
    # test for "superseded or orphaned" rather than an age heuristic. No
    # allowlist, no state to keep: the open-PR set is the single source of truth.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Delete every release-plz-* branch with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          open="$(gh pr list --state open --json headRefName -q '.[].headRefName')"
          git ls-remote --heads origin 'refs/heads/release-plz-*' |
            awk '{print $2}' | sed 's#refs/heads/##' |
            while read -r branch; do
              if grep -qxF "$branch" <<<"$open"; then
                echo "keep    $branch (backs an open PR)"
              else
                echo "delete  $branch"
                git push origin --delete "$branch"
              fi
            done

  merge-release-pr:
    name: merge the release PR
    # LAST, and additive: nothing `needs:` this job, so a refusal here cannot
    # take the pruner or the release with it. `needs: prune-release-branches`
    # chains it behind the PR job (prune's own `needs`), which serializes the
    # three acts that touch release branches and keeps prune's "has no open PR"
    # test reading the state it was written against — the current release PR
    # still OPEN. The head branch this job merges is therefore collected by the
    # NEXT push's prune, one cycle later, which is what that job is for.
    #
    # That chain carries the owner guard with it, which is why there is no `if`
    # here: `release-plz-pr` refuses to run outside this owner and on anything
    # but a push, and a skipped job skips everything that `needs` it.
    needs: prune-release-branches
    runs-on: ubuntu-latest
    # WHY MERGE WITHOUT A HUMAN, and why not GitHub's own auto-merge.
    #
    # The release PR bumps the version in `Cargo.toml`/`Cargo.lock` and nothing
    # else (`changelog_update = false`), and merging it does not release
    # anything: `release-plz-release` above `needs: ci`, so the publish is gated
    # on the gate AFTER the merge, on the merged tree. A red tree merged here
    # publishes nothing — that has been observed, a red CI skipping the publish
    # of an already-merged bump. The merge is therefore not the control point
    # the gate is, and holding it for a human only delays a release that the
    # gate will refuse or allow on its own merits either way.
    #
    # Native auto-merge cannot do this. It waits for a PR's required checks to
    # go green, and this PR's checks never do: the PR is opened with
    # `GITHUB_TOKEN`, and a `pull_request` run created that way REQUIRES A
    # WRITE-HOLDER'S APPROVAL before it will start. Nobody approves them, so
    # they sit at `action_required` forever. A PR whose checks never start is a
    # PR auto-merge waits on forever.
    permissions:
      # The merge is a write to `main`.
      contents: write
      # ...and a write to the pull request.
      pull-requests: write
      # To dispatch this workflow after the merge — see the last step.
      actions: write
    concurrency:
      group: merge-release-pr
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout: `gh` needs a repository, not a working tree, and this job
      # reads and writes nothing on disk.
      GH_REPO: ${{ github.repository }}
    steps:
      # THE LISTING IS THE AUDIT TRAIL, and it prints whether or not anything is
      # merged: every open PR, with the verdict this job reaches on it and the
      # fields it reached it from. A guard that silently matches nothing looks
      # exactly like a guard that is working.
      - name: Every open PR, and the verdict on it
        run: |
          set -uo pipefail
          gh pr list --state open --base main --limit 50 \
            --json number,headRefName,title,author \
            --jq '.[] | "\(if (.author.is_bot == true
                               and .author.login == "app/github-actions"
                               and (.headRefName | test("^release-plz-")))
                          then "MERGE " else "refuse" end)  #\(.number)  head=\(.headRefName)  bot=\(.author.is_bot)  author=\(.author.login)"'
      # THE TWO GUARDS, and they are conjunctive. A candidate must have a
      # `release-plz-*` head branch AND be authored by the Actions bot AND
      # target `main`. Only release-plz names a branch that way and only a
      # workflow holding this repository's token can author a PR as that bot, so
      # neither half is forgeable by anyone who does not already have write
      # access. A HUMAN'S PR IS NEVER MERGED HERE, whatever its branch is named.
      #
      # One consequence worth knowing before you set it: if `RELEASE_PLZ_TOKEN`
      # (the optional PAT named in the header) is ever configured, the release
      # PR is authored by the PAT'S OWNER — a human login — and this job stops
      # merging it. That is the guard working, not a bug; making the two
      # coexist is a deliberate edit here, not an accident to discover later.
      #
      # The loop is over "every PR that passes both guards" rather than over the
      # one release-plz maintains, because that dissolves both edge cases into
      # the general path: none is the terminator below, and two — which
      # release-plz does not produce — are two lawful merges rather than a case.
      - name: Merge every open bot-authored release PR
        id: merge
        run: |
          set -uo pipefail
          candidates="$(gh pr list --state open --base main --limit 50 \
            --json number,headRefName,author \
            --jq '.[] | select(.author.is_bot == true
                               and .author.login == "app/github-actions"
                               and (.headRefName | test("^release-plz-"))) | .number')"

          # THE TERMINATOR. A run that merged a release PR dispatches this
          # workflow again (next step); that dispatched run does not reach this
          # job at all — `release-plz-pr` is push-only, so it, `prune` and this
          # job are all skipped on a dispatch. Even were it reached, release-plz
          # opens no second PR for a version the manifest already carries, so
          # this is where the chain stops on its own.
          if [ -z "$candidates" ]; then
            echo "no open bot-authored release PR — nothing to merge"
            exit 0
          fi

          for pr in $candidates; do
            # Mergeability is computed asynchronously, so a PR refreshed moments
            # ago can refuse once and merge on the retry. The loop re-reads the
            # PR's own state rather than trusting the exit code: `--delete-branch`
            # can fail AFTER the merge landed, and that must not read as a
            # failure to merge (nor be retried into merging twice).
            for attempt in 1 2 3 4 5; do
              gh pr merge "$pr" --merge --delete-branch && break
              [ "$(gh pr view "$pr" --json state -q .state)" = "MERGED" ] && break
              echo "attempt $attempt: #$pr did not merge; retrying"
              sleep 15
            done
            state="$(gh pr view "$pr" --json state -q .state)"
            if [ "$state" != "MERGED" ]; then
              echo "REFUSED: #$pr is $state after 5 attempts — a human must look" >&2
              exit 1
            fi
            echo "merged #$pr"
          done
          # The dispatch below reads this, and reads it from the ONE place that
          # can know: an `exit 0` above is still a successful step, so a step
          # that merged nothing would otherwise dispatch a full gate + macOS run
          # on every push to `main` for no reason.
          echo "merged=yes" >> "$GITHUB_OUTPUT"
      # WITHOUT THIS STEP THE RELEASE NEVER SHIPS. The merge above is a push to
      # `main` performed with `GITHUB_TOKEN`, and GitHub documents that "with
      # the exception of `workflow_dispatch` and `repository_dispatch`, other
      # `GITHUB_TOKEN`-triggered events do not create workflow runs at all." So
      # the bump lands on `main` and NOTHING RUNS: no gate, no release, and the
      # version sits unpublished until some unrelated push happens by. The
      # recursion this rule exists to prevent is therefore not a hazard here —
      # it is the reason the release has to be asked for explicitly.
      #
      # A dispatch is the documented exception and it is what the header already
      # reserves a dispatch for: on it, `release-plz-pr` is skipped (push-only),
      # so `prune` and this job are skipped with it, and the run is exactly
      # `ci` + `release` + `macos` — the gate, and a publish only if the gate is
      # green. One dispatched run per merge, and it dispatches nothing further.
      #
      # It runs ONLY when a merge actually happened. A step that found no
      # candidate exits 0, which is a successful step and would carry a bare
      # `run:` here straight into a pointless gate + macOS run on every push, so
      # the condition reads the merging step's own output rather than its
      # success.
      - name: Ask for the release the merge cannot trigger
        if: steps.merge.outputs.merged == 'yes'
        run: gh workflow run release-plz.yml --ref main
