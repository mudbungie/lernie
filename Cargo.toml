[package]
name = "lernie"
version = "0.1.0"
edition = "2024"
description = "A git-backed agent harness"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
schemars = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gen-schemas"
path = "src/bin/gen_schemas.rs"
