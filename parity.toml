# (`src/ui/fleet.rs`, DESIGN §4.32), so all seven rows are gone from here. What
# it did NOT surface is the `work-diff` form that names a ball and a path and
# answers that one file's patch; that is one op with one control, so this
# ledger — which is per op — has nothing to say about it, and
