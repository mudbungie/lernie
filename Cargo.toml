[package]
name = "lernie"
version = "0.1.16"
edition = "2024"
description = "lernie: the operator seat — the window and wire client for a yog server"
license = "MIT"
readme = "README.md"
# crates.io renders this, and it is the one piece of metadata whose absence is a
# warning on every `cargo package`. It says nothing a reader of the published
# crate could not already find.
repository = "https://github.com/mudbungie/lernie"

# WHAT WOULD BE PUBLISHED, AS AN ALLOWLIST — and never as an `exclude`.
#
# The two failure modes are not symmetric. A missing `include` entry costs a
# build: loud, immediate, and fixed by a patch release. A missing `exclude`
# entry costs a publication that cannot be recalled — `cargo publish` is
# irreversible and a yanked version stays downloadable. The sibling crate
# learned this by publishing its whole tree, operator home paths and all,
# because its manifest declared neither: with no list at all, `cargo package`
# ships everything git tracks. Here that would be 298 files, including
# `scripts/leak-fixtures/`, a directory of deliberately fabricated secrets.
#
# **The leading `/` on the two bare filenames is load-bearing.** These are
# gitignore-style patterns, so one with no slash matches that basename at ANY
# depth — a bare `README.md` also ships `scripts/leak-fixtures/README.md`, the
# index of that fabricated corpus, out of a list naming no `scripts` entry.
# `src/**` contains a slash and is already anchored to the package root.
#
# Deliberately absent, each because it is commentary or apparatus rather than
# something the published crate compiles: `docs/**`, `tests/**`, `examples/**`,
# `scripts/**`, `rules/**`, `corpus/**`, `.github/**`, `.githooks/**`,
# `Makefile`, the gate configs, and the agent guide (`AGENTS.md` and its
# `CLAUDE.md` symlink). `assets/**` is absent too and that is a decision rather
# than an oversight: the mark's SVG and desktop entry are laid down by `make
# icon-seats` out of a checkout, and a `cargo install` runs no `make` — so
# shipping them would be shipping files nothing on the far side can use. The
# window's own embedded icon is generated arithmetic in `src/mark.rs` and needs
# no file at all.
#
# **Nothing in `src` is a compile-time embed**, which is what makes this list
# safe: the two directories the suite reads from disk (`assets/`, `corpus/`)
# are read by `#[cfg(test)]` code, which a published build never compiles.
# `tests/packaged_files.rs` holds all of this in both directions, over the real
# `cargo package --list`, and sweeps `src` for the embed that would break it.
include = [
    "src/**",
    "/README.md",
    "/LICENSE",
]

# THE VERSION IS THE FENCE AND IT IS NOT A CHOICE.
#
# `lernie` on crates.io carries two eras. Through **0.0.x** it was the
# agent-loop engine, which continues under the name `litany`. From **0.1.0** it
# is this crate: the seat — the window and its wire client. That single rule is
# the only thing separating the two eras in the published record, so the first
# version this crate may ever bear is 0.1.0 and nothing below it. A 0.0.z
# release from this tree would collide with the engine's own line and destroy
# the one disambiguation both READMEs promise.

# PUBLISHABLE, and the flag restates cargo's default on purpose: this line is
# where the decision is recorded, and a key that is not there records nothing.
#
# It read `false` from this crate's founding to bl-f468, and what it held back
# was never a build — it was the coordinated cutover for the whole
# four-component split (yog's docs/REMOTE.md §12), which is an operator
# decision and has now been taken. The first release under this name at 0.1.0
# is the act that fixes the fence above in the public record: irreversible, and
# not correctable in place, because a yanked version stays downloadable.
#
# What had to exist before the flag could move, and all of it does:
#
#   - the `include` ALLOWLIST above — never an `exclude`, for the asymmetry
#     stated there — and `tests/packaged_files.rs` holding it in both
#     directions over the real `cargo package --list`;
#   - the disclosure gate over the tree, over every commit that reaches it, and
#     over the store ref that publishes beside it;
#   - AGENTS.md's *Before a publish* checklist, run by a person, with each
#     item's verdict recorded in bl-f468.
#
# **This flag is necessary and it is not sufficient**, which bl-f468 learned by
# being refused. The registry holds a second switch this manifest cannot see:
# the crate `lernie` already exists — twelve 0.0.x releases of the engine era —
# and it is configured to accept **Trusted Publishing only**, so a token
# `cargo publish` is answered 403 no matter what this key says. That is a
# registry-side setting and an owner's act; it is not a manifest problem and
# there is nothing to add here to satisfy it.
#
# There is still no `make publish` and still nothing here that publishes on its
# own. A convenience target for an irreversible act is how the act happens by
# accident, and a first publish is not the shape of a recurring release anyway
# — that is the release workflow's, and it is filed rather than built.
publish = true

# A dependency lands here with the ball that first LINKS it, never before: a
# dependency added "for later" is one nobody ever reviewed, because it is
# linked by no code and so no gate and no reviewer ever reads it.
#
# LINKED SO FAR: `rustls` and `serde_json`, both by the wire client.
# `thiserror` is approved and still absent — every refusal on this surface is
# one `String` a caller prints, so there is no error enum for it to derive yet.
#
# THIS COMMENT IS THE APPROVED SET. The house rule is "zero new dependencies
# without explicit approval"; what follows is the authority for what may be
# added and on exactly what terms, and a crate not on this list needs a fresh
# approval:
#
#   rustls — `default-features = false`, features `ring`, `std`, `tls12`,
#     `logging`. The wire is mTLS (REMOTE §1.3) and nothing else may provide
#     it. `default-features = false` is load-bearing, not tidiness: rustls'
#     default features select `aws-lc-rs`, whose `aws-lc-sys` builds C and
#     breaks the single-binary story that is most of why a seat installs
#     cleanly on a laptop. `ring` is the approved provider and the one
#     substitution that is NOT at a linking ball's discretion.
#   serde_json — the wire is JSON: a frame is a JSON value and a gesture
#     envelope is a JSON object carried verbatim. Hand-rolling a parser for a
#     security boundary is worse than a dependency.
#   thiserror — the error enums, house standard rule 10. Its companion half,
#     `anyhow`, is NOT approved: `main.rs` is a thin entry with no
#     error-plumbing layer that would justify one.
#
#   eframe / egui — THE WINDOW, and the largest approval this crate will ever
#     make. Approved and linked by the ball that landed the window (bl-428f),
#     which is also the ball that re-derived the licence allow-list in
#     `deny.toml` from the lockfile that resulted. The seat is the one
#     component whose PURPOSE is a graphical face, so this is not a dependency
#     taken for convenience: without it there is no seat, only a wire client.
#     `default-features = false` with `default_fonts` and `glow` is
#     load-bearing and is not at a later ball's discretion — the defaults would
#     select the wgpu stack, which is ~50 crates for an app that draws text and
#     rectangles, and dropping `default_fonts` ships a window that renders
#     nothing. The versions track yog's pin, because the two windows are one
#     face at two releases and a skew between them is a divergence nobody
#     decided.
#
# DEFERRED, which is not the same as refused:
#   clap — only if the verb surface outgrows a hand-rolled argv match. It does
#     not today, and the question the ball that wants it must answer is whether
#     the match arms actually stopped fitting.
#
# REFUSED, and each is a refusal of a whole direction rather than of a crate:
#   tokio — the wire is synchronous `std::net`. House rule 8 (async is
#     tokio-only) stays VACUOUS here; do not add tokio to satisfy a rule that
#     matches nothing.
#   rcgen — certificates arrive out of channel, by the operator's hand
#     (REMOTE §1.4). The seat mints nothing, so a certificate library is a
#     capability the protocol says this component must not have. The suite's
#     own mint shells to `openssl`, which is the tool an operator uses, and it
#     is `cfg(test)`.
#
# `deny.toml` bans the TLS stacks that must never arrive (openssl-sys,
# native-tls, aws-lc-sys), so a manifest edit that quietly widened this
# approval — dropping `default-features = false`, most of all — fails the gate
# instead of silently re-acquiring a C toolchain.
[dependencies]
# The wire is mTLS and nothing else may provide it. The four feature terms are
# the approval's, not this ball's: `default-features = false` because rustls'
# defaults select `aws-lc-rs`, whose sys crate builds C; `ring` because it is
# the approved provider; `std` and `tls12` because the channel is synchronous
# `std::net` and the engine's safe default protocol versions include TLS 1.2.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# The wire is JSON. A gesture envelope crosses byte for byte (REMOTE §3: the
# wire adds nothing to the boundary), so this crate parses one only far enough
# to route it, and reads a reply back as the kinds the window paints.
serde_json = "1"
# The window, and the reason this crate exists at all. The three feature terms
# are the approval's: no defaults, because they select the wgpu stack; `glow`,
# because a seat draws text and rectangles; `default_fonts`, because without
# them the window opens and renders nothing. The version tracks yog's, so the
# two faces of one seat cannot skew by accident.
eframe = { version = "0.30", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.30"

[[bin]]
name = "lernie"
path = "src/main.rs"

# rustc lint gate: the toolchain is pinned (rust-toolchain.toml), so any warning
# is a deliberate event, not toolchain drift — deny the lot.
[lints.rust]
warnings = "deny"

# Clippy gate. `pedantic` runs at deny with priority -1 so the specific
# allows/denies below (default priority 0) override the group. THIS MANIFEST IS
# THE ONLY HOME FOR A SUPPRESSION — never inline an `#[allow]` to dodge it
# (rules/no-lint-suppression.yml forbids it). Every entry carries its reason.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# The bootstrap five: owned signatures and self-describing errors are house
# style, and the doc/must_use nags are advisory only.
needless_pass_by_value = "allow"   # owned params are a deliberate rule, not an oversight
module_name_repetitions = "allow"  # module-qualified type names read clearer than terse ones
missing_errors_doc = "allow"       # error enums are self-descriptive; no prose to duplicate
missing_panics_doc = "allow"       # prod is panic-free (restriction lints below) — nothing to note
must_use_candidate = "allow"       # advisory; not decorating every getter with #[must_use]

# Empirically warranted here: the prose is proper-noun dominated (lernie, yog,
# litany, thrall, mTLS) and the nag is noise on every doc comment in the crate.
doc_markdown = "allow"

# Restriction lints: prod code is panic-free and bounds-checked. These deny the
# panic family, leftover `dbg!`, and unchecked indexing/string slicing.
# `clippy --all-targets -- -D warnings` (the gate) picks them up; the test
# carve-outs live in clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"

# DEV-ONLY, AND THE "DEV" IS THE WHOLE OF THE APPROVAL (bl-dc07).
#
# The operator's ruling grants `egui_kittest` and `wgpu` as **dev-dependencies
# only**: they render the seat off-screen so an agent can look at it without a
# compositor, and nothing they bring may reach the published binary.
# `tests/packaged_files.rs` holds the file half of that and cargo holds the
# link half — a dev-dependency is not compiled into `cargo build --release`
# and does not appear in a consumer's lockfile.
#
#   egui_kittest — the headless harness: it runs the real `ui::render` on an
#     off-screen `egui::Context` with AccessKit enabled, and its `wgpu` feature
#     rasterizes the resulting frame to an image. The version is EXACT and
#     tracks `egui` term for term, because the harness links the same egui the
#     window does and a minor skew between them is two egui versions in one
#     build. Its earliest release is 0.30.0, which is why the window's own
#     pin moved from 0.29 in the ball that added this.
#   wgpu — arrives under `egui_kittest/wgpu`, via `egui-wgpu`. It is named in
#     the ruling and not declared here, because nothing in this tree calls it
#     directly: the harness owns the device and the render pass.
#   image — the encoder the rendered frame is written through. It is NOT a
#     fourth approval: `egui_kittest/wgpu` already puts it in the graph and
#     hands back an `image::RgbaImage`, so declaring it adds no crate to the
#     lockfile and only names what is already there. `default-features =
#     false` with `png`, because a PNG is the one format an agent's file reader
#     opens and every other decoder would be dead weight in the gate's build.
[dev-dependencies]
egui_kittest = { version = "=0.30.0", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# THIS LINE IS A FEATURE, NOT A SECOND DEPENDENCY, AND IT BELONGS HERE RATHER
# THAN ABOVE.
#
# The harness needs the accessibility tree, so it turns on `egui/accesskit`.
# That adds a field to `egui::PlatformOutput`, and `egui-winit` — which eframe
# links — only matches on that field when its OWN `accesskit` feature is on.
# Enabled on one side and not the other, the two do not compile together.
#
# Raising it on eframe in `[dependencies]` would fix the build and quietly
# spend the ruling: accesskit would then be linked into the released seat,
# which is a product decision nobody has taken and not one a test harness gets
# to make on the way past. Declared HERE it is unified only into builds that
# include dev-dependencies — the suite, `clippy --all-targets`, the coverage
# run — and `cargo build --release` resolves eframe exactly as the block above
# spells it. `tests/packaged_files.rs` guards the file half of the same
# promise.
eframe = { version = "0.30", default-features = false, features = ["accesskit"] }
