roles:
  worker:
    pinned:
      - goal.md
      - soul.md
      - descriptions/**
    order:
      - summary/**
      - steps/**/request.json
      - steps/**/response.json
      - skills/**
    budget_tokens: 150000
    overflow: drop_oldest_steps
  compactor:
    pinned:
      - goal.md
      - soul.md
    order:
      - steps/**
    budget_tokens: 50000
    overflow: truncate
