# bl-8ffa — a prepared start cannot be fanned, and no candidate can be accepted
# or retired.
deliver = "bl-8ffa — no candidate surface: one of n cannot be accepted here"
fan = "bl-8ffa — no candidate surface: a prepared start cannot be spread over attempts"
retire = "bl-8ffa — no candidate surface: a candidate's worktree cannot be released here"

