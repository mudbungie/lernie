[workspace]
members = [".", "crates/agent-eval"]

[package]
name = "lernie"
version = "0.0.1"
edition = "2024"
description = "A git-backed agent harness"
license = "MIT"
repository = "https://github.com/mudbungie/lernie"

[dependencies]
brazen = "=0.0.3"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
schemars = "0.8"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
# The command-surface parity checker (`tests/command_surface_parity/`,
# ARCH §3.4) parses the crate's source as the ground truth of what is
# `pub` (syn) and introspects the CLI's verb set through the one clap in
# [dependencies] — the checker itself links nothing but `cmd`.
syn = { version = "2", features = ["full", "parsing"] }

[[bin]]
name = "lernie"
path = "src/bin/lernie/main.rs"
