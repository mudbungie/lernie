name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config --global user.email "ci@lernie.local"
          git config --global user.name "lernie CI"

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml is the single source of the pin (channel +
        # components). Do NOT name a toolchain here — a floating
        # dtolnay/rust-toolchain@stable would drift from what the hook and
        # agents run, and pinning a version in this file would fork the pin
        # into two homes. rustup ships on ubuntu-latest; the first cargo
        # command in the repo makes it auto-install the exact toolchain and
        # components from rust-toolchain.toml (override install), so CI, the
        # pre-commit gate, and every agent build under identical
        # rustc / rustfmt / clippy.
        run: |
          cargo --version
          rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        # Pin to 0.35.2: 0.35.3 was yanked, and 0.35.4+ silently drops
        # inline `#[cfg(test)] mod tests;` files from tarpaulin's coverable
        # denominator. Without the pin, taiki-e/install-action grabs the
        # latest release and the runner reports a smaller "100% covered"
        # denominator than `make ci` does locally — same source tree,
        # different floors. See tarpaulin.toml for the matching local
        # requirement.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.35.2

      - name: Resolve the pinned brazen version
        # The pin's one home is the `brazen = "=<version>"` dependency in
        # Cargo.toml. `make brazen-pin` derives it there (Makefile
        # BRAZEN_PIN), the same line the crate's load-time version guard
        # reads (ARCH §4.4). Never write the number in this file: a copy
        # here would drift from the manifest, and CI would then install a
        # `bz` the guard rejects.
        id: brazen
        run: echo "pin=$(make --no-print-directory brazen-pin)" >> "$GITHUB_OUTPUT"

      - name: Cache the brazen adapter binary
        # Keyed on the pin alone — `cargo install brazen --version =<pin>`
        # is reproducible, so a hit is exactly the binary the pin names.
        # Deliberately no restore-keys: a `bz` left over from an older pin
        # would fail the version guard, and a cold miss costs one cargo
        # install. Only the binary is cached; the registry/git caches are
        # the step above, and cargo-tarpaulin has its own installer.
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/bz
          key: ${{ runner.os }}-bz-${{ steps.brazen.outputs.pin }}

      - name: Install the provider adapter (bz)
        # `make ci` runs the e2e tests, which exec the REAL `bz` against a
        # mock endpoint; without it on PATH they die with "adapter
        # subprocess: No such file or directory". No-ops on a cache hit
        # (install-bz compares `bz --version` against the pin).
        run: make install-bz

      - name: make ci
        run: make ci
