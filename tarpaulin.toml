# Repo-wide tarpaulin defaults: applied by every `cargo tarpaulin` run,
# including the pre-commit hook.
#
# Pinned tarpaulin version: 0.35.2 (also pinned in .github/workflows/ci.yml).
# 0.35.3 was yanked, and 0.35.4+ silently excludes inline `#[cfg(test)] mod
# tests;` files from the coverable denominator. The 100% floor only means
# the same thing on every machine if everyone is on the same tarpaulin —
# upgrade in lockstep (workflow + this file + Makefile preflight) or the
# floor gets quietly weaker on whichever side moves first.
#
# - `gen-schemas` is a thin wrapper over `lernie::config::schemas`
#   (fully unit-tested). Excluding it keeps the 100% coverage floor
#   meaningful without forcing a contrived test of `fn main()`.
# - `ignore-panics` excludes branches that only fire on programmer-error
#   panics (e.g. `.expect(...)` on infallible operations).
# - `timeout` is bumped above tarpaulin's 60s default because the
#   `prompt_end_to_end.rs` integration test chains two subprocess
#   binaries (`lernie new` + `lernie prompt`) under instrumentation,
#   which inflates wall-clock time well past the per-test default.
# - `args = ["--test-threads=1"]` pins serial test execution: the
#   bash-tool cascade tests deliver SIGTERM/SIGKILL to spawned shell
#   process groups, and tarpaulin's ptrace state machine races
#   against parallel teardown of those groups (`Failed to find
#   process for pid: …` → segfault). Serial execution sidesteps the
#   race; the 100% workspace coverage floor stays the same.
[default]
exclude-files = ["src/bin/*", "src/bin/lernie/*", "crates/*/src/main.rs"]
ignore-panics = true
timeout = "300s"
args = ["--test-threads=1"]
