[workspace]
members = [".", "crates/lernie-ui-egui"]

[package]
name = "lernie"
version = "0.1.0"
edition = "2024"
description = "A git-backed agent harness"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
schemars = "0.8"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"

[[bin]]
name = "gen-schemas"
path = "src/bin/gen_schemas.rs"

[[bin]]
name = "lernie"
path = "src/bin/lernie.rs"

[[bin]]
name = "lernie-provider-anthropic"
path = "src/bin/lernie_provider_anthropic.rs"
