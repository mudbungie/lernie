[package]
name = "lernie-ui-egui"
version = "0.1.0"
edition = "2024"
description = "egui/eframe frontend for the lernie agent harness"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
thiserror = "2"

[[bin]]
name = "lernie-ui-egui"
path = "src/main.rs"
