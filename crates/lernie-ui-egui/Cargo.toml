[package]
name = "lernie-ui-egui"
version = "0.1.0"
edition = "2024"
description = "egui/eframe frontend for the lernie agent harness"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
libc = "0.2"
notify = "6"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lernie-ui-egui"
path = "src/main.rs"
