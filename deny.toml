# cargo-deny supply-chain policy for lernie.
#
# Verified against cargo-deny 0.20.2 (pin any CI to this exact version). The
# allow-list is exhaustive over the committed Cargo.lock — every license that
# actually appears in the tree, nothing speculative. Re-run `cargo deny check`
# after any dependency change and fix drift here by config, never by patching a
# dependency.

[advisories]
# Reject crates whose published version has been yanked from the registry.
yanked = "deny"
# One acknowledged advisory, and the reason is recorded beside it. An entry that
# stops matching any crate makes every gate run warn `advisory-not-detected` —
# which is the signal to drop it, so this list stays exactly as long as the tree
# justifies.
ignore = [
    # `ttf-parser` is UNMAINTAINED, not vulnerable: no CVE, no exploit, no
    # patched version — the crate's author stopped, and the advisory says so
    # and names `skrifa` as the successor. It is not reachable from anything
    # this crate calls: it sits under `owned_ttf_parser` under `ab_glyph` under
    # `epaint`, which is egui's glyph rasteriser, and the fonts it parses are
    # the ones compiled into `epaint_default_fonts`. There is no untrusted font
    # input on this surface, because there is no font input at all.
    #
    # It cannot be fixed here either: no safe upgrade exists, and the swap is
    # egui's to make. So the entry is an acknowledgement rather than a
    # decision — and it is the RIGHT shape of one, because the alternative is
    # unpinning the window or turning the advisory gate off, and the second of
    # those would hide the next advisory too. Re-check it at every egui bump;
    # the day egui moves to `skrifa` this line stops matching and says so.
    "RUSTSEC-2026-0192",
    # THE NEXT THREE ARE DEV-ONLY, AND THAT IS THE WHOLE REASON (bl-dc07).
    #
    # None of them is in the SHIPPED graph. `cargo tree -e normal -i <crate>
    # --target all` answers "nothing to print" for all three: they arrive
    # behind the snapshot harness, which turns on `egui/accesskit` and so needs
    # `eframe/accesskit` to match it — and that feature is raised in
    # `[dev-dependencies]` only, so `cargo build --release` resolves none of
    # this. Re-run that command before believing this paragraph; it is the
    # check, and this text is only its record.
    #
    # `paste` is UNMAINTAINED rather than vulnerable — no CVE, no exploit, and
    # the author says so themselves. It reaches the tree twice, both times
    # through a platform backend nothing here runs: `accesskit_windows`, and
    # `metal` under `wgpu-hal`.
    "RUSTSEC-2024-0436",
    # Two denial-of-service advisories against `quick-xml` 0.30, one quadratic
    # and one an unbounded allocation, both on XML this process never sees.
    # They sit under `zbus_xml` under the AT-SPI stack (`atspi` ->
    # `accesskit_unix` -> `accesskit_winit`), which is the Linux accessibility
    # BUS — and the harness never starts one: it reads the accessibility tree
    # in-process, out of `egui`'s own output, with no desktop, no session bus
    # and no compositor anywhere near it. The attacker position the advisories
    # describe does not exist in a test binary.
    #
    # Neither is fixable here. The patched `quick-xml` is 0.41 and `zbus_xml`
    # 4.0 pins `^0.30`, so the upgrade belongs to that chain and arrives when
    # accesskit moves. Re-check at every egui bump; the day it lands these
    # entries stop matching and the gate says so.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# EXHAUSTIVE OVER THE COMMITTED `Cargo.lock`, and derived from it rather than
# guessed at. Every entry below is a licence some crate in the lockfile
# actually carries. A speculative allow-list is an allow-list nobody read, and
# it is worst on the day it silently covers a crate no approval ever named — so
# widen this only with the ball that links the crate, and re-derive it from the
# lockfile that ball produces.
#
# RE-DERIVED at bl-428f, the ball that linked the window. eframe/egui multiplied
# the graph roughly tenfold and added exactly four licences; every other crate
# it brought was already covered by an entry below, almost all of them under the
# ubiquitous `MIT OR Apache-2.0`. The four are listed with the crate that forced
# them, because a licence with no named crate is one nobody can check.
#
#   MIT             lernie itself, and most of the graph under an OR.
#   Apache-2.0      the other half of the ubiquitous dual licence, and half of
#                   `ring`'s "Apache-2.0 AND ISC" — an AND, so both terms have
#                   to be here or `ring` is rejected.
#   ISC             `ring`'s other half, and `untrusted` and `rustls-webpki`
#                   outright. These are the certificate-verification path.
#   BSD-3-Clause    `subtle`, the constant-time primitives under `ring`.
#   Unlicense       `memchr`, under `serde_json`.
#
# The window's four, none of them an OR this list could have satisfied twice:
#
#   BSL-1.0         `clipboard-win` and `error-code`, the Windows clipboard
#                   path under `arboard` under `egui-winit`. Sole licence, so
#                   there is no alternative term to take instead. Permissive,
#                   and it is the only copyleft-adjacent name here that is not:
#                   the Boost licence's whole point is that binaries need carry
#                   no notice.
#   Unicode-3.0     the `icu_*` normalisation crates under `idna` under `url`
#                   under `webbrowser` — how egui opens a hyperlink. Sole
#                   licence, and the Unicode data files' own terms.
#   OFL-1.1         `epaint_default_fonts`, and the reason `default_fonts` is a
#                   named feature rather than a default: this is the FONT, not
#                   code. Its expression is an AND of three, so this and the
#                   line below are both mandatory or the window ships with
#                   nothing to draw glyphs with.
#   LicenseRef-UFL-1.0
#                   the other half of that AND — the Ubuntu Font Licence,
#                   which carries no SPDX id and so arrives as a LicenseRef.
#   Zlib            `slotmap`, the arena `egui_glow` keys its textures by. Sole
#                   licence, and the most permissive name on this list.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "Zlib",
]

[bans]
# Duplicate versions are informational; a bare "*" version requirement is a
# hard error — an unpinned dependency is a build that means something different
# tomorrow.
multiple-versions = "warn"
wildcards = "deny"

# TLS stack ban, rustls-only. The seat's wire is mTLS (REMOTE §1.3), so exactly
# one stack will ever be approved. OpenSSL
# (`openssl-sys`) and the system TLS bridge (`native-tls`) are a C toolchain
# dependency and a non-portable one; either breaks the single-binary story that
# is most of why a seat installs cleanly on a laptop.
#
# `aws-lc-sys` is here for a subtler reason: rustls' DEFAULT features select
# `aws-lc-rs`, whose sys crate builds C. The approved manifest line takes
# `default-features = false` with `ring` for exactly that reason — but a later
# manifest edit that dropped the flag would pull the C toolchain back in
# silently, and no other gate would say so. Banning the sys crate makes that
# edit fail here instead. All three match nothing today, which is the point.
deny = [
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "aws-lc-sys" },
]

[sources]
# Every crate must come from a known registry — no unvetted registries and no
# ad-hoc git sources. There is no `allow-git` list and none is wanted: a git
# pin blocks publication outright and re-exposes the tree to a rewritten
# upstream history orphaning the rev. A registry pin has neither failure mode.
