# Version-bump policy.
#
# Every source commit here is a short imperative subject plus a `[bl-xxxx]`
# trailer — not Conventional Commits — so release-plz's default increment
# applies, which is PATCH: 0.0.1 -> 0.0.2. That is the intended default; the
# release PR should always propose the smallest step.
#
# To opt in to a bigger bump, put `[minor]` or `[major]` as a standalone
# bracketed token in any commit message that lands in the release window —
# preceded by start-of-string or whitespace, followed by end-of-string or
# whitespace. For non-conventional messages release-plz matches the regex
# against the full commit text, so the marker can sit in the subject (alongside
# `[bl-xxxx]`) or in the body. Prose mentions like `[minor]/[major]`
# (slash-joined, no boundary whitespace) do not match — that keeps a commit
# describing this convention from bumping itself.
#
# `features_always_increment_minor` is left at its default (false), so even a
# Conventional-Commit `feat:` lands as a patch bump below 1.0.0.
[workspace]
semver_check = false
custom_minor_increment_regex = '(^|\s)\[minor\](\s|$)'
custom_major_increment_regex = '(^|\s)\[major\](\s|$)'

[changelog]
#
# Subject protection: subjects here are non-conventional (see the header
# comment above), but git-cliff still runs every message through the
# Conventional-Commits parser, and any leading `word:` / `word::` token —
# `e2e::advance_cli …`, `fleet: drop …` — parses as a type and is stripped
# from the rendered bullet (0.0.2 shipped `- :advance_cli baton test …`,
# bl-1923). release-plz exposes no knob to turn that parser off, so this
# preprocessor duplicates the leading token instead: `e2e::x` becomes
# `e2e: e2e::x`, the parser consumes exactly the injected copy, and the
# bullet renders the original subject verbatim. The token class
# `[^\s():!]+:` mirrors git-conventional's type grammar (a run of anything
# but whitespace/parens/colon/bang, then `:`), so every subject the pattern
# rewrites is guaranteed to parse and be re-stripped — nothing can render
# doubled. Subjects whose first colon comes later (`… reach the CLI: --from
# …`) never parsed as conventional and are left alone. `word(scope):` and
# `word!:` shapes stay unprotected (type still eaten) — no subject in this
# history uses them. The gate skip-parsers below keep matching: duplication
# preserves the first token and its colon. release-plz's own `chore:
# release vX` commits are excluded by package-equality when commits are
# collected, upstream of preprocessing, so duplicating `chore:` cannot leak
# them into the changelog.
commit_preprocessors = [
    { pattern = '^([^\s():!]+:)', replace = '${1} ${1}' },
]

#
# Entry uniformity: every task carries `tests` / `docs` / `alignment` gate
# subtasks (AGENTS.md), and each one closes as its own commit on `main` with a
# gate-shaped subject — `alignment [bl-xxxx]`, `docs gate: …`, `v0.3 tests
# gate: …`. Those record verification, not product, so the first parser skips
# them and the changelog stays one bullet per shipped change. The pattern
# deliberately requires a `:` or a `[bl-` right after the gate label, so a real
# subject that merely opens with the word (`tests/install.rs mutates …`,
# `docs/ARCHITECTURE.md …`) is not swallowed; a gate close written in free prose
# still has to be pruned by hand.
commit_parsers = [
    { message = '(?i)^(gate:|(v[0-9][0-9.]* )?(docs|tests|alignment)( gate)?( green)? *(:|\[bl-))', skip = true },
    { message = ".*", group = "Changes" },
]

# agent-eval is an internal-only crate (`publish = false` in
# crates/agent-eval/Cargo.toml) — the workspace's eval runner, not a shipped
# artifact. Keep release-plz off it entirely: no version bump, no tag, no
# GitHub Release, no crates.io publish.
#
# Both keys are required: `release = false` only tells release-plz to skip
# version-bump/tag/GitHub-Release for this package, but release-plz validates
# `publish` independently against Cargo.toml's own `publish` field regardless
# of `release`. Without `publish = false` here, `release-plz release` aborts
# with "has `publish = false` ... but it has `publish = true` in the
# release-plz configuration" before publishing anything, for any crate.
# Cargo.toml stays the single source of truth on publishability; this key
# exists only so release-plz's own validator agrees with it.
[[package]]
name = "agent-eval"
release = false
publish = false

# lernie-eval-agent is internal-only for the same reason (`publish = false`
# in crates/lernie-eval-agent/Cargo.toml) — the eval harness driver, the
# agent-eval runner's counterpart (README "Run the suite"). Both keys, for
# the reason spelled out above: `release = false` alone still leaves
# release-plz's publishability validator disagreeing with Cargo.toml, which
# aborts `release-plz release` for every crate.
[[package]]
name = "lernie-eval-agent"
release = false
publish = false
