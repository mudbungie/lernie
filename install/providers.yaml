# Global harness-root providers.yaml (ARCH §4.1).
#
# Holds the (endpoint, auth) pair for every inference provider this
# harness can reach, plus the model registry that names them.
# Per-repo providers.yaml files reference entries here by provider
# name + model id; this file rotates independently of any specific
# conversation repo.
#
# `make install` lays this down only if no providers.yaml already
# exists at the harness root, so re-running install never clobbers
# rotated credentials or hand-edited entries.

providers:
  anthropic:
    endpoint: https://api.anthropic.com
    auth:
      type: api_key
      env: ANTHROPIC_API_KEY

models:
  claude-sonnet-4-7:
    provider: anthropic
    model_id: claude-sonnet-4-7
    capabilities: [tool_use_native, prompt_caching, streaming, stop_sequences]
    context_window: 200000
  claude-haiku-4-5:
    provider: anthropic
    model_id: claude-haiku-4-5
    capabilities: [tool_use_native, prompt_caching, streaming, stop_sequences]
    context_window: 200000
