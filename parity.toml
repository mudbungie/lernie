# THE PARITY EXEMPTION LEDGER — every op this seat owes a control and has not
# built one for, each citing the ball that will build it.
#
# The contract is yog's `docs/PARITY.md` §7. The roster of what is owed is not
# here and is not this repository's to decide: it is the `surface` field on the
# vendored corpus's `reply/help.json` rows, generated from yog's own help table,
# which is the one home for the suite-level fact "which ops owe every seat a
# discoverable interactable". A row classed `control` there and absent from the
# accessibility tree here must appear below or the gate reddens.
#
# HOW IT IS READ. One line per op, `op = "reason"`, and nothing else — blank
# lines and `#` comments are the only other content the parser accepts. Every
# reason must cite a ball id (`bl-xxxx`), because a reason that cites nothing is
# a TODO with no owner and no way to tell whether it is still true.
#
# BOTH DIRECTIONS, so the file cannot rot quietly (PARITY §5):
#
#   - a row for an op that IS now tagged fails — stale; delete it, the control
#     is the record;
#   - a row for an op the roster no longer classes `control` fails — rotted;
#     upstream moved the classification and this line is answering a question
#     nobody asks any more.
#
# And it is never silent: `src/snapshot/parity` prints this whole roster on
# every run, so an absence is read out loud beside the assertion that allows it.
#
# SEVERABILITY, which is the house test: deleting a line re-reddens the gate and
# changes no code. Adding a control deletes a line and changes no config.

# bl-d2af — the ball pane: a workspace's balls are readable nowhere, and none
# can be created, claimed, closed or amended from this seat.
assign = "bl-d2af — no ball pane: nothing here claims a ready ball for a workspace"
balls = "bl-d2af — no ball pane: the ball/workspace bindings are painted nowhere"
board = "bl-d2af — no ball pane: the fleet board has no column view here"
close = "bl-d2af — no ball pane: a ball cannot be closed or delivered from this seat"
create = "bl-d2af — no ball pane: a ball cannot be filed from this seat"
marks = "bl-d2af — no ball pane: the branch an agent tracks its tasks on is unreadable"
release = "bl-d2af — no ball pane: a held ball cannot be unclaimed here"
update = "bl-d2af — no ball pane: a ball's title, body, schedule and journal are unreachable"
workspace-balls = "bl-d2af — no ball pane: what a workspace holds and what it cost are unpainted"

# bl-b8f7 — the trail pane reads and cannot act. bl-4c48 landed the read half:
# `ops` is painted, so its row is gone from here. These two are its acts, and
# both fan across every channel because neither names a workspace.
ack = "bl-b8f7 — the trail pane has no controls: an alarm cannot be acknowledged from this seat"
clear-trail = "bl-b8f7 — the trail pane has no controls: nothing truncates the trail from this seat"

# bl-a43a — the fleet has no surface: a workspace can be neither run, stopped,
# watched nor scanned, and what its agents changed is readable nowhere. The
# loop's own state is not among these: it rides on `board`, which is the ball
# pane's read (bl-d2af).
arm = "bl-a43a — no fleet controls: the cheap-model watch cannot be raised here"
disarm = "bl-a43a — no fleet controls: the watch cannot be dropped here"
disband = "bl-a43a — no fleet controls: a running fleet cannot be stopped from this seat"
fleet = "bl-a43a — no fleet controls: a workspace's ready balls cannot be run from here"
scan = "bl-a43a — no fleet controls: nothing flushes a workspace's inboxes from here"
science = "bl-a43a — no fleet controls: the delivery attempts and their costs are unpainted"
work-diff = "bl-a43a — no fleet controls: what the agents changed is readable nowhere"

# bl-2cf7 landed the records pane — `steps` and `files` carry a control on
# `src/ui/composer/acts.rs` and are gone from this ledger. What it left it
# left on two seams, each cited to its own ball below.
#
# bl-b52c — the conversation's spine: the rail's operable commits, the
# governing config commit, and the fork whose `from` is a commit an operator
# can only discover off the rail.
fork = "bl-b52c — no spine surface: `from` is a commit off the rail and `role` a name off the lineages, and this seat reads neither — a control demanding two strings nothing here can discover only looks actionable"
governing = "bl-b52c — no spine surface: the governing config commit is unpainted"
rail = "bl-b52c — no spine surface: the spine and its operable commits are unpainted"

# bl-3257 — the conversation's deeper records: its own row whole, one step's
# drill-in under the steps list the records pane now paints, and the
# undelivered mail.
agent = "bl-3257 — no deep-records surface: the selected conversation's own row is unpainted"
inbox = "bl-3257 — no deep-records surface: undelivered mail is readable nowhere"
step = "bl-3257 — no deep-records surface: one step's records are readable nowhere, though the steps list now paints the seq that addresses them"

# bl-8ffa — a prepared start cannot be fanned, and no candidate can be accepted
# or retired.
deliver = "bl-8ffa — no candidate surface: one of n cannot be accepted here"
fan = "bl-8ffa — no candidate surface: a prepared start cannot be spread over attempts"
retire = "bl-8ffa — no candidate surface: a candidate's worktree cannot be released here"

# bl-4a2c landed the tuning quartet — `roles`, `effort`, `priority` and
# `model` all carry controls on `src/ui/tuning.rs` and are gone from this
# ledger. What it did not build is the config FILE itself, which is a second
# pane with a second subject: bytes, on a lineage, at a path.
#
# bl-5c53 — the config-file pane: the lineages, the file a lineage holds, and
# the bytes read out of one and written back to it.
config = "bl-5c53 — no config-file pane: a config file's bytes are neither read nor written here"
lineages = "bl-5c53 — no config-file pane: the lineages and the paths each holds are unpainted"

# bl-48fa landed the destructive-act idiom (DESIGN §4.20) and with it
# `delete-workspace`, which carries a control on `src/ui/unmake.rs` and is gone
# from this ledger.

# bl-40ec landed the window's own reads — the three ops that name no workspace
# (DESIGN §4.21). `workspaces` carries a control on `src/ui/roster.rs`, `help`
# on the control that opens `src/ui/commands.rs`, and `search` on the act
# inside `src/ui/find.rs`; all three are gone from this ledger.
#
# What it did NOT close is upstream's and is not a missing surface here: a
# `search` hit spells its workspace and its project as the ENGINE's own
# absolute path rather than as the name every gesture carries, so a hit cannot
# be fed to the act whose keys it spells (yog bl-ef16, the recurrence of yog
# bl-22ab). The rows are read and the reason is on the glass; there is no line
# here, because the op is surfaced and this file records absences.

# bl-e3c5 landed the login pane (DESIGN §4.24) and with it all four of the
# sign-in family: `providers` carries the control that opens the pane,
# `login` and `models` carry the two controls on a provider row, and
# `login-tail` is the held lane that pane's own control starts — so none of
# them is in this ledger any more. What it did not build is a paste-back arm
# for a browser-only row signed in from a seat with no shell, and that is not a
# missing surface here: REMOTE §8.3 rules the port-forward a STATED operator
# remedy and refuses to make it a channel feature, so the pane says it rather
# than offering a verb that cannot finish.

# bl-e53c — the tool-host surface is unpainted, so a foot's advertised set and
# its subject_cwd consent are readable nowhere.
answer = "bl-e53c — no tool-host pane: a held tool call cannot be released or declined here"
clients = "bl-e53c — no tool-host pane: the registered machines and what they offer are unpainted"
restore = "bl-e53c — no tool-host pane: tool auto-approval cannot be given back from this seat"
revoke = "bl-e53c — no tool-host pane: tool auto-approval cannot be taken away here"

# bl-7782 landed the strip's pin: one control on the aimed roster row whose
# word and op follow the row's own rank, so `pin` and `unpin` are both tagged
# and neither is in this ledger. They are the strip's acts and not the
# conversation row's, which is why bl-dbc9's context menu was the wrong home.
