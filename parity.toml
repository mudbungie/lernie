# THE PARITY EXEMPTION LEDGER — every op this seat owes a control and has not
# built one for, each citing the ball that will build it.
#
# The contract is yog's `docs/PARITY.md` §7. The roster of what is owed is not
# here and is not this repository's to decide: it is the `surface` field on the
# vendored corpus's `reply/help.json` rows, generated from yog's own help table,
# which is the one home for the suite-level fact "which ops owe every seat a
# discoverable interactable". A row classed `control` there and absent from the
# accessibility tree here must appear below or the gate reddens.
#
# HOW IT IS READ. One line per op, `op = "reason"`, and nothing else — blank
# lines and `#` comments are the only other content the parser accepts. Every
# reason must cite a ball id (`bl-xxxx`), because a reason that cites nothing is
# a TODO with no owner and no way to tell whether it is still true.
#
# BOTH DIRECTIONS, so the file cannot rot quietly (PARITY §5):
#
#   - a row for an op that IS now tagged fails — stale; delete it, the control
#     is the record;
#   - a row for an op the roster no longer classes `control` fails — rotted;
#     upstream moved the classification and this line is answering a question
#     nobody asks any more.
#
# And it is never silent: `src/snapshot/parity` prints this whole roster on
# every run, so an absence is read out loud beside the assertion that allows it.
#
# SEVERABILITY, which is the house test: deleting a line re-reddens the gate and
# changes no code. Adding a control deletes a line and changes no config.

# bl-d2af landed the ball pane's READ half — `balls`, `board`,
# `workspace-balls` and `marks` are painted, so their rows are gone from here.
# What it left is the ACT half, and that is bl-f7ae below.
#
# bl-f7ae — the ball pane reads and cannot act: nothing here files, claims,
# releases, amends or closes a ball. All five name a project and a `--as` name
# and NO workspace, so all five fan — one control filing five balls is the
# question to settle before writing them rather than after.
assign = "bl-f7ae — the ball pane has no controls: nothing here claims a ready ball"
close = "bl-f7ae — the ball pane has no controls: a ball cannot be closed or delivered from this seat"
create = "bl-f7ae — the ball pane has no controls: a ball cannot be filed from this seat"
release = "bl-f7ae — the ball pane has no controls: a held ball cannot be unclaimed here"
update = "bl-f7ae — the ball pane has no controls: a ball's title, body, schedule and journal are unreachable"

# bl-b8f7 — the trail pane reads and cannot act. bl-4c48 landed the read half:
# `ops` is painted, so its row is gone from here. These two are its acts, and
# both fan across every channel because neither names a workspace.
ack = "bl-b8f7 — the trail pane has no controls: an alarm cannot be acknowledged from this seat"
clear-trail = "bl-b8f7 — the trail pane has no controls: nothing truncates the trail from this seat"

