[package]
name = "lernie-provider-anthropic"
version = "0.1.0"
edition = "2024"
description = "Reference provider adapter for Anthropic's Messages API (ARCH §4.4)"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lernie-provider-anthropic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
