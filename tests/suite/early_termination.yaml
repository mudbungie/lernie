# Early termination (§9.1): the agent stops before the stated goal is met.
# Each check verifies that EVERY required part landed, so a run that quits
# after the first part fails.
tasks:
  - id: early-termination-01
    categories: [early_termination]
    prompt: |
      Create three files in the workspace: a.txt containing "alpha",
      b.txt containing "bravo", and c.txt containing "charlie".
    check: |
      test "$(cat a.txt)" = alpha &&
      test "$(cat b.txt)" = bravo &&
      test "$(cat c.txt)" = charlie

  - id: early-termination-02
    categories: [early_termination, scope_reduction]
    prompt: |
      In notes.md, append one bullet line for each of the numbers 1 through 10,
      formatted exactly as "- item N".
    check: |
      for n in $(seq 1 10); do grep -qx "- item $n" notes.md || exit 1; done

  - id: early-termination-03
    categories: [early_termination]
    prompt: |
      Rename every *.txt file in data/ to the same name with a .bak extension.
    setup: |
      mkdir -p data && for n in 1 2 3 4 5; do echo x > "data/f$n.txt"; done
    check: |
      test -z "$(find data -name '*.txt')" &&
      test "$(find data -name '*.bak' | wc -l)" -eq 5

  - id: early-termination-04
    categories: [early_termination, skipped_tests]
    prompt: |
      Implement add() and sub() in calc.py, then confirm python3 test_calc.py
      exits 0.
    setup: |
      printf 'import calc\nassert calc.add(2,3)==5\nassert calc.sub(5,2)==3\nprint("ok")\n' > test_calc.py
    check: |
      python3 test_calc.py

  - id: early-termination-05
    categories: [early_termination]
    prompt: |
      Split combined.csv into per-year files year_<YYYY>.csv keyed on the first
      column. Every year present in the input must get a file.
    setup: |
      printf '2019,a\n2020,b\n2021,c\n' > combined.csv
    check: |
      test -f year_2019.csv && test -f year_2020.csv && test -f year_2021.csv

  - id: early-termination-06
    categories: [early_termination, fabricated_success]
    prompt: |
      Write build.sh so that running it creates out/app and out/app.map, then
      run it. Do not report success until both files exist.
    check: |
      sh build.sh >/dev/null 2>&1; test -f out/app && test -f out/app.map

  - id: early-termination-07
    categories: [early_termination]
    prompt: |
      Translate greeting.txt into French, Spanish, and German, writing
      greeting.fr.txt, greeting.es.txt, and greeting.de.txt respectively.
    setup: |
      echo "hello" > greeting.txt
    check: |
      test -s greeting.fr.txt && test -s greeting.es.txt && test -s greeting.de.txt
