# bl-2cf7 landed the records pane — `steps` and `files` carry a control on
# `src/ui/composer/acts.rs` and are gone from this ledger. What it left it
# left on two seams, each cited to its own ball below.
#
# bl-b52c landed the spine inside the records pane (DESIGN §4.29) — `rail` and
# `governing` carry tags on the control that opens it, and `fork` carries one
# per operable notch, so all three are gone from this ledger. What it did not
# dissolve is the `role`: it is a name off the config lineages, which is
# bl-5c53's read, so the control types it and says so rather than offering a
# list this seat cannot obtain. That is a stated limit on a surfaced op and
# therefore no line here, which records absences.

# bl-3257 landed the deeper three inside the records pane (DESIGN §4.30) —
# `agent` and `inbox` carry tags on the control that opens it, and `step`
# carries one per row of the steps ledger, whose `seq` is its address. All
